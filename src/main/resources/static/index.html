<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Catalog</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="top__inner">
    <h1 class="brand">Catalog</h1>

    <form class="search" id="searchForm" role="search" autocomplete="off">
      <div class="search__field">
        <input
                id="searchInput"
                type="text"
                placeholder="Search for a product (min. 2 characters)"
                aria-label="Search products"
                role="combobox"
                aria-expanded="false"
                aria-controls="suggestions"
                aria-autocomplete="list">
        <button type="submit" class="search__btn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
        </button>
      </div>
      <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
    </form>

    <button type="button" class="btn btn--primary add" id="addBtn">Add product</button>
  </div>
</header>

<main>
  <section id="resultsSection" class="block block--results" hidden aria-live="polite">
    <div class="block__head">
      <h2 id="resultsTitle"></h2>
      <button type="button" class="btn btn--ghost" id="clearSearch">Clear search</button>
    </div>
    <div id="resultsGrid" class="grid"></div>
  </section>

  <section class="block">
    <div class="block__head">
      <h2>All products</h2>
      <span id="count" class="muted"></span>
    </div>
    <div id="status" class="status" role="status"></div>
    <div id="grid" class="grid"></div>
  </section>
</main>

<dialog id="formDialog" aria-labelledby="formTitle">
  <form id="productForm" class="form">
    <h2 id="formTitle">Add product</h2>

    <label for="fName">Name</label>
    <input id="fName" name="name" type="text" required maxlength="120">

    <label for="fDescription">Description</label>
    <textarea id="fDescription" name="description" rows="3" maxlength="255"></textarea>

    <div class="form__row">
      <div>
        <label for="fPrice">Price (USD)</label>
        <input id="fPrice" name="price" type="number" min="0" step="0.01" required>
      </div>
      <div>
        <label for="fStock">Stock</label>
        <input id="fStock" name="stock" type="number" min="0" step="1" required>
      </div>
    </div>

    <div class="form__actions">
      <button type="button" class="btn btn--ghost" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn btn--primary">Save product</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
